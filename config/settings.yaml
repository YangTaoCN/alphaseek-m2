# AlphaSeek-M2 configuration
# All thresholds are evaluated locally (zero API cost). DeepSeek is only called
# for tickers that pass the hard technical filter.
#
# Watchlist selection is backtest-driven: every name must show positive
# expectancy in BOTH the 5y and 3y walk-forward windows with >=15 trades each
# (1y is too small a sample to judge - 3-10 trades). See the
# "Watchlist selection" section in README.md for the per-ticker numbers.
# Dropped after testing: TSLA (-0.08R, PF 0.86), MSFT (3y negative),
# SNPS/ADBE/QCOM/UBER/ARKK/BOTZ/SMCI (negative in both windows).

watchlist:
  # broad / sector ETFs
  - SPY
  - QQQ
  - SOXX     # best ETF on the board: +0.54R/5y, +0.43R/3y, positive all 3 windows
  - AIQ      # AI & big-data ETF: +0.56R/5y, +0.56R/3y
  - VOO
  # mega-cap tech
  - NVDA
  - AAPL
  - AMZN
  - GOOGL
  - META     # strongest single name: +0.71R/5y, PF 3.19
  - ORCL
  - CRM
  - AVGO
  # AI infrastructure & semiconductors
  - AMD
  - VRT      # data-center power/cooling: +0.59R/5y, +0.54R/3y
  - DELL     # AI servers: +0.52R/5y, +0.54R/3y
  - KLAC     # +0.64R/5y, PF 2.87
  - TER      # +0.49R/5y, +0.80R/3y

indicators:
  ema_fast: 20
  ema_slow: 50
  rsi_period: 14
  rsi_min: 45
  rsi_max: 68
  volume_surge_multiplier: 1.2
  # bars of history pulled from yfinance (>= ema_slow + buffer)
  lookback_days: 200
  # minimum avg dollar volume (price * shares) to consider a ticker liquid
  min_avg_dollar_volume: 20000000

ai:
  # overridden by DEEPSEEK_MODEL in .env when set
  model: deepseek-chat        # or: deepseek-reasoner
  base_url: https://api.deepseek.com
  temperature: 0.2
  max_tokens: 1200
  timeout_seconds: 90
  # skip the API call entirely and emit the deterministic rule-based report
  dry_run: false

notifications:
  macos_desktop: true
  telegram_bot_token: ""
  telegram_chat_id: ""
  # generic webhook (Slack / Discord / n8n ...). Leave empty to disable.
  webhook_url: ""
  # only notify when AI confidence >= this value
  min_confidence: 6.0

output:
  log_dir: logs
  save_json_report: true
