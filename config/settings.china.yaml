# AlphaSeek-M2 - China A-share profile (Shanghai .SS / Shenzhen .SZ only)
#
# Run:  python main.py --config config/settings.china.yaml --dry-run --no-notify
#
# Scope: Shanghai/Shenzhen listings only. Hong Kong (.HK) and US-listed China
# names (NTES / MCHI / FXI / KWEB) were tested and removed - the mandate is
# names actually tradable on 沪市 / 深市.
#
# Selection rule (same as the US watchlist): positive expectancy in BOTH the
# 5y and 3y walk-forward windows with >=15 trades in each. Long-term growth is
# a second, independent filter - several of the biggest 10-year compounders
# fail the screen outright (CATL +1495% and Moutai +429% are negative in BOTH
# windows), so growth alone is never a reason to include.
#
# Removed for scope: 1810.HK 小米, 2318.HK 中国平安(H), NTES, MCHI, FXI.
# Tested and rejected (negative in both windows): 宁德时代, 贵州茅台, 迈瑞医疗,
# 伊利股份, 格力电器, 海螺水泥, 兴业银行, 海尔智家, 韦尔股份, 中国石化(3y -),
# 中国神华(3y -), 长江电力(3y ~0), 五粮液(3y -).

