indicators:
  ema_fast: 20
  ema_slow: 50
  rsi_period: 14
  rsi_min: 45
  rsi_max: 68
  volume_surge_multiplier: 1.2
  lookback_days: 200
  # A-share turnover is quoted in CNY, so this floor is ~CNY 20M not USD 20M
  min_avg_dollar_volume: 20000000

ai:
  model: deepseek-chat
  base_url: https://api.deepseek.com
  temperature: 0.2
  max_tokens: 1200
  timeout_seconds: 90
  dry_run: false

notifications:
  macos_desktop: false
  telegram_bot_token: ""
  telegram_chat_id: ""
  webhook_url: ""
  min_confidence: 6.0

output:
  # separate directory so the China reports never overwrite the US ones
  log_dir: logs/china
  save_json_report: true
